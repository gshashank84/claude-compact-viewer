[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-compact-viewer"
version = "0.1.0"
description = "A read-only local web viewer for Claude Code session compact summaries — decide whether to resume a session or start fresh."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shashank Gupta" }]
keywords = ["claude", "claude-code", "compact", "viewer", "llm", "sessions", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gshashank84/claude-compact-viewer"
Issues = "https://github.com/gshashank84/claude-compact-viewer/issues"

[project.scripts]
compact-viewer = "compact_viewer:main"

[tool.setuptools]
py-modules = ["compact_viewer"]
